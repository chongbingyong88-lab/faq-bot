# Kheng Dental — 50 questions written from the site, 8 Sep 2026.
#
# This is the only one of the three sites that PUBLISHES a price list, and it
# publishes two of them: /pricelist and /pricelist-signature carry different
# amounts for the same treatment. Roughly a third of these rows exist to test
# that a customer is never quietly quoted the wrong tier.
#
# Site facts these rows rest on:
#   13+ clinics across Klang Valley; HQ on Jalan Tun HS Lee, Petaling Street
#   Most branches Mon-Fri 9AM-6PM, Sat-Sun 9AM-5PM
#   Damansara Utama is the exception: 10AM-8PM / 10AM-5PM
#   Standard list: scaling & polishing 80-150, EMS painless scaling 188-325
#   Signature list: scaling & polishing 120-150, EMS painless scaling 250,
#                   ceramic crown 1800, polishing only 100
#
# Corrected 9 Sep 2026 against the two crawled price pages. Four rows named
# only one of the two lists, or attributed a figure to the wrong one — row 1
# called 250 the "signature list" scaling price when 250 is signature EMS
# and signature scaling & polishing is 120-150. A reply that was right about
# both lists therefore failed. Criteria now state both lists per treatment;
# nothing was relaxed, and rule 4 (say which list) still decides the row.

# ---------------------------------------------------------------- prices
- question: how much is scaling and polishing
  lang: en
  answer_type: factual
  answerable: true
  severity: critical
  retrieval_target:
    - pricelist
  evaluation:
    required_any: ["80", "150", "120", "188", "325", "250"]
    semantic: >
      Must quote a scaling price that appears on the site. Scaling &
      Polishing is 80-150 on the standard list and 120-150 on the
      signature list; EMS Painless Scaling is a different treatment at
      188-325 standard and 250 signature. The
      figure must carry RM. If the reply gives two different amounts it
      must say which price list each belongs to. FAIL on a bare number
      with no currency, and FAIL on a refusal — this price IS published.
  note: the headline test for the two-tier price list

